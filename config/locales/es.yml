es:
  activerecord:
    models:
      project: Proyecto
    attributes:
      project:
        name: Nombre
        slug: Identificador
  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: no puede estar vacío
      taken: ya está en uso
      too_long: es demasiado largo (máximo %{count} caracteres)
      invalid: no es válido
      not_a_number: no es un número
      greater_than_or_equal_to: debe ser mayor o igual que %{count}
      inclusion: no está incluido en la lista
      restrict_dependent_destroy:
        has_many: "No se puede eliminar porque tiene %{record} asociados"
  date:
    abbr_day_names: [dom, lun, mar, mié, jue, vie, sáb]
    day_names: [domingo, lunes, martes, miércoles, jueves, viernes, sábado]
    abbr_month_names: [null, ene, feb, mar, abr, may, jun, jul, ago, sep, oct, nov, dic]
    month_names: [null, enero, febrero, marzo, abril, mayo, junio, julio, agosto, septiembre, octubre, noviembre, diciembre]
    order:
      - :day
      - :month
      - :year
    formats:
      default: "%d/%m/%Y"
      short: "%d %b"
  time:
    am: a. m.
    pm: p. m.
    formats:
      default: "%d/%m/%Y %H:%M"
      short: "%d %b %H:%M"
      long: "%d de %B de %Y, %H:%M"
  number:
    format:
      delimiter: ","
      separator: "."
      precision: 1
